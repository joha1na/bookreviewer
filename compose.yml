# Production Docker Compose
# Für Development siehe compose.dev.yml

services:
  nginx:
    image: nginx:latest
    container_name: bookreviewer_nginx_prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/templates:/etc/nginx/templates
      - ./container_logs/nginx:/var/log/nginx
      - ./public_html:/usr/share/nginx/html
    ports:
      - "8080:80"
    environment:
      - NGINX_PORT=80
      - NGINX_PROXY=http://application:3000
    depends_on:
      application:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookreviewer

  application:
    image: bookreviewer:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookreviewer_app_prod
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - bookreviewer
    # Production: Kein Port-Expose (nur über nginx)

networks:
  bookreviewer:
    driver: bridge