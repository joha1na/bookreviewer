# Development Docker Compose
# Verwendung: docker-compose -f compose.dev.yml up

services:
  nginx:
    image: nginx:latest
    container_name: bookreviewer_nginx_dev
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/templates:/etc/nginx/templates
      - ./container_logs/nginx:/var/log/nginx
      - ./public_html:/usr/share/nginx/html
    ports:
      - "8080:80"
    environment:
      - NGINX_PORT=80
      - NGINX_PROXY=http://host.docker.internal:3000
    restart: unless-stopped
    networks:
      - bookreviewer

  # Für Development läuft Next.js direkt auf dem Host
  # um Hot Reload zu ermöglichen
  application-dev:
    image: node:20-alpine
    container_name: bookreviewer_app_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    networks:
      - bookreviewer

networks:
  bookreviewer:
    driver: bridge
